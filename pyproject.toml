[build-system]
requires = ["setuptools>=61,<77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tsshap-timeseries"
version = "0.1.1"
description = "TsSHAP-style feature-based explainability for univariate forecasting: backtesting, interpretable features, tree surrogate (sklearn/XGBoost/LightGBM/CatBoost), SHAP, notebook-driven TSICE comparison."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT License" }
authors = [
  { name = "Eliza Knapp" },
]
keywords = ["time-series", "forecasting", "explainability", "shap", "xai", "ts-shap"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "pandas>=2.0",
  "numpy>=1.26",
  "scipy>=1.11",
  "scikit-learn>=1.3",
  "statsmodels>=0.14",
  "shap>=0.44",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
# Tree libraries (surrogate backends). Core install uses sklearn GradientBoosting if these are absent.
xgboost = ["xgboost>=2.0"]
lightgbm = ["lightgbm>=4.0"]
catboost = ["catboost>=1.2"]
prophet = ["prophet>=1.1"]
viz = ["seaborn>=0.13"]
# Everything from the course requirements.txt-style stack
all = [
  "xgboost>=2.0",
  "lightgbm>=4.0",
  "catboost>=1.2",
  "prophet>=1.1",
  "seaborn>=0.13",
]
dev = ["build>=1.0", "twine>=4.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["tsshap*"]
